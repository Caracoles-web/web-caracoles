name: Publicar vinos temporal

on:
  push:
    branches:
      - main
    paths:
      - "PUBLISH_VINOS_TRIGGER.txt"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Decodificar y verificar PDF
        run: |
          mkdir -p assets/cartas
          base64 -d ".tmp-publish/carta-vinos-es.pdf.b64" > "assets/cartas/carta-vinos-es.pdf"
          base64 -d ".tmp-publish/wine-list-en.pdf.b64" > "assets/cartas/wine-list-en.pdf"
          base64 -d ".tmp-publish/carte-des-vins-fr.pdf.b64" > "assets/cartas/carte-des-vins-fr.pdf"

          echo "b6594280355fbb71f7257876371362067181962883b4a65eb97898eb452fbde2  assets/cartas/carta-vinos-es.pdf" | sha256sum -c -
          echo "64a57fcf7f5a160bc5a95d9e53b56483cd6ecf337ee5ac3ec66426f9dd22d1c9  assets/cartas/wine-list-en.pdf" | sha256sum -c -
          echo "b3a22b637e9590a1210fe88ac6e3178ad709b316673320710223625a58b4497f  assets/cartas/carte-des-vins-fr.pdf" | sha256sum -c -

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cartas/carta-vinos-es.pdf assets/cartas/wine-list-en.pdf assets/cartas/carte-des-vins-fr.pdf
          git commit -m "Publica cambios de precios en carta de vinos"
          git push
